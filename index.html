<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- interactive-widget=resizes-content : demande au navigateur mobile de
         redimensionner réellement la page quand le clavier virtuel s'ouvre
         (au lieu de simplement le superposer par-dessus), pour que les
         éléments en bas d'écran (comme le champ de saisie du chat) restent
         visibles au-dessus du clavier. Pris en charge par Chrome/Edge
         Android et Safari iOS 17.4+ ; ignoré sans effet néfaste ailleurs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#160f0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loup Garou d'Afrique" />
    <title>Loup Garou d'Afrique</title>
    <meta name="description" content="Jouez au Loup Garou d'Afrique en ligne, l'application arbitre la partie pour vous." />

    <!-- Aperçu de partage (WhatsApp, Discord, Twitter/X...). L'URL ci-dessous
         est celle du déploiement Vercel actuel — à mettre à jour si un nom
         de domaine dédié est branché par la suite. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loup Garou d'Afrique" />
    <meta property="og:title" content="Loup Garou d'Afrique" />
    <meta property="og:description" content="Jouez au Loup Garou d'Afrique en ligne, entre amis, jusqu'à 20 joueurs. L'application arbitre la partie pour vous." />
    <meta property="og:url" content="https://loup-garou-app-six.vercel.app/" />
    <meta property="og:image" content="https://loup-garou-app-six.vercel.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Loup Garou d'Afrique" />
    <meta name="twitter:description" content="Jouez au Loup Garou d'Afrique en ligne, entre amis, jusqu'à 20 joueurs." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
